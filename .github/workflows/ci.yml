name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    # WPF アプリを含むため Windows でビルドする
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MyDicomViewer.slnx

      - name: Build
        run: dotnet build MyDicomViewer.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution MyDicomViewer.slnx --configuration Release --no-build
