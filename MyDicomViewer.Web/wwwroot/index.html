<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MyDicomViewer — DICOM ビューア</title>
    <meta name="description" content="医用画像の標準規格 DICOM をブラウザーで表示するビューア。濃度調整・計測・タグ一覧・匿名化、胸部 X 線の AI スクリーニング（ブラウザーの中で推論）。画像はどこにも送りません。" />
    <meta name="theme-color" content="#161C23" />
    <base href="/MyDicomViewer/" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
</head>
<body>
    <div id="app">
        <div class="boot">
            <img class="boot-logo" src="icons/icon.svg" alt="" />
            <div class="boot-name">MyDicomViewer</div>
            <div class="boot-bar"><span></span></div>
            <div class="boot-text">読み込んでいます… <span class="boot-pct"></span></div>
            <noscript><p>このアプリを使うには JavaScript を有効にしてください。</p></noscript>
        </div>
    </div>
    <div id="blazor-error-ui" role="alert">
        問題が起きました。<a href="" class="reload">読み込み直す</a>
        <a class="dismiss" aria-label="閉じる">✕</a>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script src="js/boot.js"></script>
</body>
</html>
